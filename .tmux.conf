# Scrollback buffer (default 2000 is too small for serial sessions)
set-option -g history-limit 50000

set-option -g allow-rename on
set-option -g automatic-rename on
set-option -g set-titles on
set-option -sa terminal-overrides ",*256color:Tc"

set-window-option -g aggressive-resize

# pane navigation and management
setw -g mode-keys vi
set -g mouse on
bind-key j join-pane -s !
bind-key J command-prompt -p "join all panes from window:" "run-shell '~/.tmux/scripts/join_all_panes.sh %%'"
#bind-key C-h select-pane -L
#bind-key C-j select-pane -D
#bind-key C-k select-pane -U
#bind-key C-l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# enforce colors
set -g default-terminal "tmux-256color"

# alerting
set -g visual-bell both

# status bar
set -g status-style default,bold
set -g window-status-current-style reverse
set -g status-left ""
set -g status-right " \"#{=21:pane_title} #S\" %H:%M %Y%m%d"
setw -g clock-mode-style 24
bind-key S set status

# configuration managment
bind r source-file ~/.tmux.conf \; display "Reloaded config"

# List of plugins
#set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# Make the status line pretty and add some modules
set -g status-right-length 100
set -g @logging-path "~/Downloads/"
