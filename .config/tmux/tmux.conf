# Scrollback buffer (default 2000 is too small for serial sessions)
set-option -g history-limit 50000

set-option -g allow-rename on
set-option -g automatic-rename on
# Window name = command:folder (bash shows just "bash").
set-option -g automatic-rename-format "#{?#{==:#{pane_current_command},bash},bash,#{pane_current_command}:#{b:pane_current_path}}"
set-option -g set-titles on
set-option -sa terminal-overrides ",*256color:Tc"

set-window-option -g aggressive-resize

# pane navigation and management
setw -g mode-keys vi
set -g mouse on
bind-key j join-pane -s !
bind-key J command-prompt -p "join all panes from window:" "run-shell '~/.config/tmux/scripts/join_all_panes.sh %%'"
#bind-key C-h select-pane -L
#bind-key C-j select-pane -D
#bind-key C-k select-pane -U
#bind-key C-l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# enforce colors
set -g default-terminal "tmux-256color"

# Pass OSC 8 hyperlinks through to Ghostty (tmux 3.4+); otherwise tmux strips
# app-emitted clickable links (ls --hyperlink, etc.). Requires a
# full `tmux kill-server` to take effect (terminal-features aren't re-read by
# `source-file`/prefix+r).
set -sa terminal-features ",tmux-256color:hyperlinks"

# alerting
set -g visual-bell both

# status bar
# Status bar: dark-grey background so it stands apart from panes; not bold
# overall, only the current window and session name are. Yellow while C-b is pending.
set -g status-style "#{?client_prefix,bg=yellow fg=black,bg=colour236 fg=colour250}"
set -g window-status-current-style "reverse,bold"
# Current tab: drop the redundant "*" flag (reverse already marks it); keep Z/M/etc.
# Tab = colored index + space + name. Index is blue on other tabs; on the current
# (reversed) tab the same color becomes a blue chip behind the number.
set -g window-status-format '#[fg=colour75]#I#[fg=default] #W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#[fg=colour75]#I#[fg=default] #W#{?#{s/\*//:window_flags}, #{s/\*//:window_flags},} '
# Room for the  PREFIX tag; Nerd Font icons can be 2 cells wide
set -g status-left-length 15
# Nerd Font icons (\uXXXX escapes; Ghostty's font is InconsolataNerdFontMono):
# F11C keyboard, EA85 terminal, F017 clock, F073 calendar
set -g status-left "#{?client_prefix,#[reverse] \uF11C PREFIX #[noreverse] ,}"
set -g status-right " \uEA85 #[bold]#S#[nobold]  \uF017 %H:%M  \uF073 %Y%m%d"
setw -g clock-mode-style 24
bind-key S set status

# configuration managment
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded config"
# Disable C-b C-z (suspend-client): too easy to hit by accident.
unbind C-z

# List of plugins
#set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'


# Make the status line pretty and add some modules
set -g status-right-length 100
set -g @logging-path "~/Downloads"
set -g @screen-capture-path "~/Downloads"
set -g @save-complete-history-path "~/Downloads"
# Right-click pane menu with a Logging submenu (tmux-logging actions)
source-file ~/.config/tmux/pane-menu.conf

